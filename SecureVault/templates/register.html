<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVault - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#fff8dc;color:#2b2b2b;font-family:Segoe UI,sans-serif}.card{border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,0.1);border:1px solid #f0d980}.btn-amber{background:#ffc107;color:#222;font-weight:bold}</style>
</head>
<body class="d-flex align-items-center min-vh-100">
<div class="container" style="max-width: 440px;">
    <div class="card p-4">
        <h3 class="text-center fw-bold mb-3">📝 Buat Akun SecureVault</h3>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}{% for cat, msg in messages %}
            <div class="alert alert-{{cat}} py-2 small">{{msg}}</div>
          {% endfor %}{% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Username Baru</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-amber w-100 py-2">Daftar Akun</button>
        </form>
        <hr>
        <div class="text-center"><a href="/login" class="small text-dark fw-bold">Kembali ke Login</a></div>
    </div>
</div>
</body>
</html>
